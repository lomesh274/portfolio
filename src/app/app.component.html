<router-outlet></router-outlet>
<div class="container pt-5">
  <div class="mx-auto">
    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
      <div class="form-group">
        <label for="exampleInputEmail1">Email address</label>
        <input type="email"  #email="ngModel" required name="email" [(ngModel)]="model.email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
        <div class="text-danger" *ngIf="email.errors && loginForm.submitted ">
          <p>Email is required</p>

        </div>
        <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
      </div>
      <div class="form-group">
        <label for="exampleInputPassword1">Password</label>
        <input type="{{model.passwordType ? 'text' : 'password'}}" name="password"  [(ngModel)]="model.password" class="form-control" id="exampleInputPassword1" placeholder="Password">
      </div>
      <div class="form-check">
        <input type="checkbox"[checked]="model.passwordType"
        (change)="model.passwordType = !model.passwordType"  class="form-check-input" id="exampleCheck1">
        <label class="form-check-label"  for="exampleCheck1">View password</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

  </div>
</div>
