<div class="login-container">
  <div class="login-card">
    <mat-card>
      <mat-card-header>
        <mat-card-title class="login-title">Admin Login</mat-card-title>
        <mat-card-subtitle>Enter your credentials to access the admin panel</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              type="email" 
              formControlName="email"
              placeholder="Enter your email"
              [autocomplete]="'email'"
            />
            <mat-error *ngIf="email?.invalid && email?.touched">
              <span *ngIf="email?.errors?.['required']">Email is required</span>
              <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input 
              matInput 
              [type]="hidePassword ? 'password' : 'text'" 
              formControlName="password"
              placeholder="Enter your password"
              [autocomplete]="'current-password'"
            />
            <mat-icon matSuffix (click)="hidePassword = !hidePassword" class="password-toggle">
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
            <mat-error *ngIf="password?.invalid && password?.touched">
              <span *ngIf="password?.errors?.['required']">Password is required</span>
              <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
            </mat-error>
          </mat-form-field>

          <div class="login-actions">
            <button 
              mat-raised-button 
              type="submit" 
              color="primary"
              class="login-button"
              [disabled]="loginForm.invalid || authService.isInitializing()"
            >
              <span *ngIf="!authService.isInitializing()">Login</span>
              <mat-progress-spinner 
                *ngIf="authService.isInitializing()"
                diameter="20"
                mode="indeterminate"
              ></mat-progress-spinner>
            </button>
          </div>
        </form>

        <div class="error-message" *ngIf="authService.error()">
          <mat-icon class="error-icon">error</mat-icon>
          {{ authService.error() }}
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
