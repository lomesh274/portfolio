<mat-toolbar class="navbar" color="primary">
  <div class="navbar-container">
    <!-- Logo/Name -->
    <a routerLink="/home" class="logo" (click)="closeMenu()">
      <span class="logo-text">Lomesh Yadav</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      @for (item of navItemsArray; track item.path) {
        <a 
          mat-button 
          routerLink="{{item.path}}" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Theme Toggle & Auth Actions -->
    <div class="navbar-actions">
      <button 
        mat-icon-button 
        (click)="toggleTheme()"
        class="theme-toggle"
        aria-label="Toggle theme"
      >
        <mat-icon>{{ themeIcon }}</mat-icon>
      </button>

      <!-- Auth Actions -->
      @if (!authService.isAuthenticated()) {
        <a mat-button routerLink="/auth/login" class="login-button">
          Login
        </a>
      } @else {
        <button 
          mat-icon-button 
          (click)="authService.logout().subscribe()"
          class="logout-button"
          aria-label="Logout"
        >
          <mat-icon>logout</mat-icon>
        </button>
      }

      <!-- Mobile Menu Toggle -->
      <button 
        mat-icon-button 
        (click)="toggleMenu()"
        class="mobile-menu-toggle"
        aria-label="Toggle menu"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation -->
  <div 
    class="mobile-nav" 
    [class.open]="isMenuOpen()"
  >
    <nav class="mobile-nav-content">
      @for (item of navItemsArray; track item.path) {
        <a 
          mat-button 
          routerLink="{{item.path}}" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="mobile-nav-link"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>
</mat-toolbar>

<!-- Mobile Menu Overlay -->
<div 
  class="mobile-menu-overlay" 
  [class.active]="isMenuOpen()"
  (click)="closeMenu()"
></div>
